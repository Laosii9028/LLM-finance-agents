name: US market daily brief

on:
  schedule:
    # UTC 週日~週五 22:17 = 台灣週一~週六 06:17。
    - cron: '17 22 * * 0-5'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: us-market-daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run professional market brief
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_ANALYSIS_MODEL: ${{ vars.GEMINI_ANALYSIS_MODEL }}
          GEMINI_LEARNED_MODEL: ${{ vars.GEMINI_LEARNED_MODEL }}
          GEMINI_ANALYSIS_FALLBACK_MODELS: ${{ vars.GEMINI_ANALYSIS_FALLBACK_MODELS }}
          GEMINI_LEARNED_FALLBACK_MODELS: ${{ vars.GEMINI_LEARNED_FALLBACK_MODELS }}
        run: python main.py

      - name: Commit learned map and analysis history
        if: ${{ always() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add taiwan_map_learned.json briefs.json market_analysis.json taiwan_analysis.json taiwan_map.json
          git diff --staged --quiet || git commit -m "chore: daily update ($(date -u +%F))"
          git push
